<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 30px;
            padding-bottom: 50px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }
        .card-header {
            font-weight: 600;
        }
        .text-error {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: block;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">

            <h2 class="text-center mb-4 text-primary fw-bold">Employee Management System</h2>

            <!-- Success Alert -->
            <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
                <strong th:text="${successMessage}"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Employee Registration Form -->
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Add New Employee</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/employees}" th:object="${employee}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" th:field="*{fullName}" id="fullName" class="form-control" placeholder="e.g. John Doe">
                                <span class="text-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="text" th:field="*{email}" id="email" class="form-control" placeholder="e.g. john@example.com">
                                <span class="text-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                            </div>

                            <div class="col-md-4">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="text" th:field="*{phone}" id="phone" class="form-control" placeholder="e.g. 0771234567">
                                <span class="text-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                            </div>

                            <div class="col-md-4">
                                <label for="department" class="form-label">Department</label>
                                <input type="text" th:field="*{department}" id="department" class="form-control" placeholder="e.g. Information Technology">
                                <span class="text-error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
                            </div>

                            <div class="col-md-4">
                                <label for="salary" class="form-label">Salary</label>
                                <input type="number" step="0.01" th:field="*{salary}" id="salary" class="form-control" placeholder="e.g. 75000">
                                <span class="text-error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
                            </div>

                            <div class="col-12 text-end mt-3">
                                <button type="submit" class="btn btn-success px-4">Save Employee</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Employee List Table -->
            <div class="card">
                <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Employee List</h5>
                    <span class="badge bg-light text-dark fs-6">
                        Total Employees: <span th:text="${employeeCount}">0</span>
                    </span>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Department</th>
                                    <th>Salary</th>
                                    <th class="text-center" style="width: 180px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(listEmployees)}">
                                    <td colspan="7" class="text-center text-muted py-3">No employees found.</td>
                                </tr>
                                <tr th:each="emp : ${listEmployees}">
                                    <td th:text="${emp.id}">1</td>
                                    <td th:text="${emp.fullName}">John Doe</td>
                                    <td th:text="${emp.email}">john@example.com</td>
                                    <td th:text="${emp.phone}">0771234567</td>
                                    <td th:text="${emp.department}">IT</td>
                                    <td th:text="${#numbers.formatDecimal(emp.salary, 1, 2)}">75000.00</td>
                                    <td class="text-center">
                                        <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-sm btn-primary me-1">Edit</a>
                                        <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this employee?');">
                                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
