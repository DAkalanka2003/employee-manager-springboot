<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 40px;
            padding-bottom: 50px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
        }
        .text-error {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: block;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Edit Employee</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
                        <!-- Hidden ID field -->
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" th:field="*{fullName}" id="fullName" class="form-control" placeholder="Full Name">
                                <span class="text-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="text" th:field="*{email}" id="email" class="form-control" placeholder="Email">
                                <span class="text-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                            </div>

                            <div class="col-md-6">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="text" th:field="*{phone}" id="phone" class="form-control" placeholder="Phone">
                                <span class="text-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                            </div>

                            <div class="col-md-6">
                                <label for="department" class="form-label">Department</label>
                                <input type="text" th:field="*{department}" id="department" class="form-control" placeholder="Department">
                                <span class="text-error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
                            </div>

                            <div class="col-12">
                                <label for="salary" class="form-label">Salary</label>
                                <input type="number" step="0.01" th:field="*{salary}" id="salary" class="form-control" placeholder="Salary">
                                <span class="text-error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
                            </div>

                            <div class="col-12 text-end mt-4">
                                <a th:href="@{/employees}" class="btn btn-secondary me-2">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">Update Employee</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
